const Q=[{"module": "Module 2", "number": 1, "title": "Cybersecurity software", "passage": "Software that automatically detects suspicious behavior on computer networks has become so sensitive that much of the activity it detects is ______, which means that rather than replacing human experts, such software has increased the need for cybersecurity specialists to interpret the flagged activity and determine whether it is a cause for concern.", "question": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "imperceptible", "B": "invariable", "C": "malicious", "D": "ambiguous"}, "answer": "D", "source_page": 37, "visual": null, "warning": ""}, {"module": "Module 2", "number": 2, "title": "Refrigerant lines", "passage": "The longevity of heating and cooling systems depends significantly on technicians properly ______ refrigerant lines during installation. If non-condensable gases, moisture, and microscopic debris aren't purged from the lines, vital components can be damaged during use, leading to total system failure.", "question": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "detangling", "B": "evacuating", "C": "designating", "D": "bracing"}, "answer": "B", "source_page": 38, "visual": null, "warning": ""}, {"module": "Module 2", "number": 3, "title": "Cargo trucks", "passage": "Although the cumulative weight of the goods in a cargo truck affects fuel efficiency, this effect—and the corresponding effect on the cost of a given trip to the trucking company—is relatively small. The large majority of a trip's cost stems from the mere fact of the truck being on the road; accordingly, trucking firms are ______ to dispatch trucks that aren't full.", "question": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "entitled", "B": "prone", "C": "loath", "D": "admonished"}, "answer": "C", "source_page": 39, "visual": null, "warning": ""}, {"module": "Module 2", "number": 4, "title": "Nickel decontamination (Pauleit)", "passage": "Though research indicating that plants may preferentially absorb nickel and other essential elements (i.e., those necessary for plant growth) from soil over nonessential ones seems to suggest that nickel-contaminated soil may be especially ______ to decontamination by plants, Stephan Pauleit and team found that plants tended to accumulate the nonessential element cadmium at higher rates than nickel; the presence of cadmium in such soils should thus be assessed before pursuing plant-based nickel decontamination.", "question": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "unresponsive", "B": "detrimental", "C": "pertinent", "D": "amenable"}, "answer": "D", "source_page": 41, "visual": null, "warning": ""}, {"module": "Module 2", "number": 5, "title": "Microwave heating", "passage": "Microwave heating, a thermal technology used to preserve food on an industrial scale, is generally considered to be an improvement over more conventional thermal preservation methods. Scientists in Latin America have contributed to a better understanding of this technology, with researchers from Mexico demonstrating its effectiveness in preserving mamey sapote fruits. As research continues, scientists hope to make advancements in hybrid systems combining multiple food preservation technologies, which would be advantageous over using microwave heating alone, <u>given that it often heats food unevenly</u>.", "question": "Which choice best describes the function of the underlined portion in the text as a whole?", "choices": {"A": "It suggests an advantage that microwave heating has over conventional thermal processing methods.", "B": "It identifies a flaw of microwave heating technologies.", "C": "It introduces microwave heating as a food processing technology.", "D": "It explains why conventional thermal processing methods are popular in commercial applications."}, "answer": "B", "source_page": 43, "visual": null, "warning": ""}, {"module": "Module 2", "number": 6, "title": "Positive expressive writing", "passage": "Positive expressive writing is self-reflective writing aimed at exploring positive topics and feelings like joy. Techniques of positive expressive writing include one called \"benefit finding,\" which involves writing about positives that come from difficult experiences, and \"satisfaction processes,\" which involves writing in-depth about how certain experiences lead to feelings of fulfillment. In a large-scale analysis, Lauren Hoult and colleagues determined that while different techniques produce varying outcomes, they all tend to have a more consistent effect on well-being and positive outlook than on physical health and stress.", "question": "Which choice best describes the overall structure of the text?", "choices": {"A": "It identifies several positive emotions and then asserts that positive expressive writing should be done daily to amplify those emotions.", "B": "It gives an overview of positive expressive writing and then states a research finding about this type of writing.", "C": "It introduces a study about positive expressive writing and then explains that the researchers are planning a follow-up study.", "D": "It describes one popular technique of positive expressive writing and then names the techniques researchers have found to be most useful."}, "answer": "B", "source_page": 44, "visual": null, "warning": ""}, {"module": "Module 2", "number": 7, "title": "Global cooperation (Texts 1 & 2)", "passage": "<div class=\"textblock\"><strong>Text 1</strong><p>It's clear that worldwide cooperation is needed to tackle global issues such as climate change. However, it hasn't been clear how to foster strong group cohesion to motivate prosocial behavior at a global level given that humans tend to align more locally, from family to nationality. Evidence now shows that being prompted to consider the shared biology of all humans can cause individuals to identify more strongly with humanity overall, suggesting that emphasis on the \"global family tree\" may promote collective action.</p></div><div class=\"textblock\"><strong>Text 2</strong><p>Perhaps counterintuitively, a focus on group distinctions can help ensure that responsibility for issues with global effects (e.g., natural resource depletion and climate change) is shared globally. For example, though young people don't always view themselves as essential parties in such matters, reminders of their collective role as future inheritors of problems left unsolved can spark their engagement.</p></div>", "question": "Which choice best describes a notable difference in focus between Text 1 and Text 2?", "choices": {"A": "Both texts establish that people need to be made aware of the specific ways global issues are likely to affect them individually, but Text 1 focuses on the empathy those details inspire and Text 2 focuses on the obligation those details entail.", "B": "Both texts suggest that embracing commonalities can be beneficial when it comes to urging people to collective action to address global issues, but Text 1 focuses on the broadest scope of connection and Text 2 focuses on connections more limited in scope.", "C": "Both texts imply that global issues are equally relevant to all people living today, but Text 1 focuses on the idea that such issues will remain broadly relevant for the foreseeable future and Text 2 focuses on the idea that certain issues may soon become less relevant.", "D": "Both texts indicate that global issues should be addressed with large-scale shared efforts, but Text 1 focuses on the idea that it may be most effective to link global and local coordination and Text 2 focuses on the idea that local efforts sometimes divert attention from broader coordination."}, "answer": "B", "source_page": 45, "visual": null, "warning": ""}, {"module": "Module 2", "number": 8, "title": "Butterfly behavior", "passage": "Biologist Grace Herzel and colleagues conducted a study of how butterfly color and weather conditions relate to butterfly behavior, which wouldn't have been possible without data gathered by students and other amateur science enthusiasts in the community. Considering over three years' worth of data, the researchers found that white butterflies were observed on green flowers more often than any other butterflies were, and that butterflies were observed to feed more often on cloudy days than on other days.", "question": "According to the text, which factors seemed to be linked to the behavior of butterflies in Grace Herzel and colleagues' study?", "choices": {"A": "Neither butterfly color nor weather conditions", "B": "Both butterfly color and weather conditions", "C": "Weather conditions but not butterfly color", "D": "Butterfly color but not weather conditions"}, "answer": "B", "source_page": 46, "visual": null, "warning": ""}, {"module": "Module 2", "number": 9, "title": "Strontium isotope ratios (table)", "passage": "A student is studying igneous rock formations on Elba Island, Italy, and reviews published data on the ratio of strontium isotopes (87Sr/86Sr) in minerals from a specific rock sample. These isotope ratios provide information about the composition of the magma that formed the rock. Ratios below 0.710 suggest more material from the mantle in the magma, while ratios increasing above that number usually indicate greater proportions of material from the continental crust. The minerals in the rock sample record three growth stages: crystal core zones formed first, then rim zones, and finally the surrounding matrix. The student concludes that the rock sample ______", "question": "Based on the information given, which choice most effectively uses data from the table to complete the student's conclusion?", "choices": {"A": "shows evidence of increasing continental crust material in later-forming minerals.", "B": "does not show the expected 87Sr/86Sr ratios across the stages of mineral formation.", "C": "contains 87Sr/86Sr ratios too similar to provide reliable information about magma sources.", "D": "formed from magma with decreasing but persistent crustal influence."}, "answer": "D", "source_page": 47, "visual": {"type": "table", "title": "Strontium Isotope Ratios for an Igneous Rock Sample", "headers": ["Rock sample region", "87Sr/86Sr ratio"], "rows": [["Crystal core", "0.71685"], ["Crystal rim", "0.71548"], ["Crystal matrix", "0.71416"]]}, "warning": ""}, {"module": "Module 2", "number": 10, "title": "Jakarta traffic restriction (graph)", "passage": "In 2016, the city of Jakarta—one of the world's largest metropolitan areas—revoked a rule that restricted the use of major roads in the city's business district to only vehicles with three or more passengers during rush hours (7:00–10:00 a.m. and 4:30–7:00 p.m.). As researchers had expected, this move led to increased traffic delays during those times on the roads whose use had been limited, especially in the later rush hour period. Surprisingly, delays also worsened during other periods of time and on roads that hadn't been subject to the rule; the data most clearly reflect this effect in the period of ______", "question": "Which choice most effectively uses data from the graph to complete the statement?", "choices": {"A": "4:30–7:30 p.m. for previously restricted roads.", "B": "10:00 a.m.–4:30 p.m. for previously unrestricted roads.", "C": "7:00–10:00 a.m. for both types of roads.", "D": "7:00–8:00 p.m. for both types of roads."}, "answer": "D", "source_page": 48, "visual": {"type": "chart", "title": "Change in Average Traffic Delay After End of Restriction (minutes per kilometer)", "labels": ["6–7 a.m.", "7–10 a.m.", "10 a.m.–4:30 p.m.", "4:30–7 p.m.", "7–8 p.m.", "8 p.m.–6 a.m."], "a": [0.0, 0.98, 0.55, 2.48, 1.98, 0.05], "b": [0.03, 0.13, 0.71, 0.6, 1.32, 0.16], "legend": ["Previously restricted roads", "Previously unrestricted roads"]}, "warning": ""}, {"module": "Module 2", "number": 11, "title": "Dingo divergence", "passage": "Australia's modern population of dingoes, an ancient lineage of canids, comprises two genetically distinct groups that inhabit different sides of the country (west and east). Many have attributed this divergence to the nearly 3,500-mile-long \"dingo fence,\" a barrier installed to prevent access to livestock, that created a division of Australia into large southeast and northwest sections around 150 years ago. However, having analyzed DNA from ancient dingo specimens ranging from hundreds to thousands of years old, paleogeneticist Sally Wasef and colleagues reject that common explanation.", "question": "Which finding, if true, would most directly explain why Wasef and colleagues reject the common explanation presented in the text?", "choices": {"A": "The continent-wide population structure of modern dingoes matches that of the dingoes that were present in Australia around 2,000 years ago.", "B": "Ancient dingoes quickly dispersed throughout Australia after being introduced in two independent waves from distinct source populations at least 3,000 years ago.", "C": "The two earliest known sets of skeletal dingo remains in Australia date to around 3,400 years ago at a site in the west and around 3,300 years ago at a site in the east.", "D": "New Guinea singing dogs, a closely related species, began interbreeding with dingoes in southeast Australia 2,200–2,600 years ago and with dingoes in northwest Australia in the same period."}, "answer": "A", "source_page": 49, "visual": null, "warning": ""}, {"module": "Module 2", "number": 12, "title": "Ediacaran silica cements (graph)", "passage": "Silica cements associated with casts of soft-bodied marine organisms from the Ediacaran period (circa 538–635 million years ago) are plausibly attributable to one of two phenomena: rapid postmortem preservation of the organisms via precipitation of cements from silica-rich oceans or cement precipitation via high-pressure reactions long after the organisms were preserved by some other means. Recognizing that such reactions generally result in cements with germanium/silicon (Ge/Si) ratios lower than those of silica grains recovered from the same portion of sandstone, Lidya Tarhan et al. investigated silica cements and grains associated with Ediacaran soft-bodied casts at a site in South Australia.", "question": "Based on the information in the text and the graph, Tarhan et al. could most reasonably draw which conclusion?", "choices": {"A": "The range of Ge/Si ratios is larger for the cements than for the grains, which suggests that the cements are likely the result of high-pressure reactions that occurred long after the organisms were preserved by some other means than precipitation from a silica-rich ocean.", "B": "The distribution of Ge/Si ratios indicates that a portion of the cements could have precipitated via high-pressure reactions, which suggests that organisms at the site were less likely to have been preserved via rapid precipitation from a silica-rich ocean than Tarhan et al. hypothesized.", "C": "The distribution of Ge/Si ratios of the cements and grains is largely inconsistent with the cements having precipitated via high-pressure reactions, which implicitly lends support to the idea that the organisms at the site were quickly preserved by cement precipitation from a silica-rich ocean.", "D": "The total number of cement samples is much lower than the total number of grains precipitated via high-pressure reactions, which suggests that rapid precipitation from silica-rich oceans could account for the preservation of the site's organisms."}, "answer": "C", "source_page": 50, "visual": {"type": "chart", "title": "Distribution of Silica Cements and Grains Associated with South Australian Ediacara Casts by Ge/Si Ratio", "labels": ["<2.0", "2.0–2.5", "2.5–3.0", "3.0–3.5", "3.5–4.0", "4.0–4.5", "4.5–5.0", ">5.0"], "a": [30, 12, 14, 15, 12, 8, 5, 5], "b": [80, 11, 4, 2, 2, 1, 1, 0], "legend": ["Silica cements (%)", "Silica grains (%)"]}, "warning": ""}, {"module": "Module 2", "number": 13, "title": "Çatalhöyük population estimates", "passage": "In 1967, archaeologist James Mellaart claimed that at its peak, Çatalhöyük—a 33-acre Neolithic village in present-day Turkey that dates from approximately 7100 to 5950 BCE—housed between 8,000 to 10,000 residents, an estimate based on the excavation of dense clusters of mud brick buildings that were thought to have been dwellings. Arguing that such estimates should be reevaluated, Ian Kuijt and Arkadiusz Marciniak (2024) cite radiocarbon data and ethnographic modeling that suggest the heterogeneity of building use in Çatalhöyük, with many individual buildings being inhabited for relatively brief periods—20 to 30 years or less—before being abandoned or repurposed for nonresidential functions (e.g., storage). Accordingly, these recent findings challenge the assumption that ______", "question": "Which choice most logically completes the text?", "choices": {"A": "the number of buildings at Çatalhöyük would have been sufficient to accommodate a population that expanded from 8,000 to 10,000 inhabitants by 5950 BCE.", "B": "the use of mud bricks is a reliable indicator that a structure had been used either as a dwelling or for nonresidential purposes.", "C": "the density of excavated buildings at Çatalhöyük can serve as a proxy for how many people inhabited the village at a given time.", "D": "the buildings excavated at Çatalhöyük at the time of Mellaart's research had served a residential purpose as early as 7100 BCE."}, "answer": "C", "source_page": 51, "visual": null, "warning": ""}, {"module": "Module 2", "number": 14, "title": "Bennu sodium evaporites", "passage": "Chondrite meteorites recovered on Earth tend to show negligible concentrations of sodium-rich evaporites. Following collection in space and return to Earth in controlled nitrogen environments with extremely low (1%) humidity, material from the asteroid Bennu—which shares compositional features with a chondrite subclass—was found to have significant sodium evaporite concentrations. After five months in Earth air at 30%–40% humidity (lower-than-average humidity for most nondesert Earth locations), a small sample of Bennu material showed significant evaporite deterioration and new compound formation; after eight months in similar conditions, another sample experienced complete loss of sodium evaporites. Together, these observations suggest that ______", "question": "Which choice most logically completes the text?", "choices": {"A": "the nitrogen storage environment in which the Bennu material was transported may have facilitated the formation of sodium-rich evaporites that then deteriorated when exposed to atmospheric humidity typical of most nondesert locations on Earth.", "B": "the sodium evaporite concentrations on Bennu may have once been similar to those on recovered chondrites, but exposure to Earth's atmospheric humidity affected Bennu's evaporites and led to new compound formation.", "C": "sodium-rich evaporites are scarce on recovered chondrites in part due to the length of time those chondrites have been exposed to much lower humidity levels than those typically found on Earth.", "D": "the discrepancy between sodium evaporite concentrations on recovered chondrites and those initially observed on the Bennu material may be attributable to the chondrites' exposure to atmospheric humidity typical of many Earth environments."}, "answer": "D", "source_page": 52, "visual": null, "warning": ""}, {"module": "Module 2", "number": 15, "title": "Roman sumptuary laws", "passage": "The Lex Iulia sumptuaria of 18 BCE was one in a succession of ancient Roman sumptuary laws governing expenditures on luxury, primarily regulating large banquets and other lavish events. Such laws, enacted against a backdrop of anxiety about social dynamism, were intended to limit aspirational overreaching for status but were infrequently enforced. Moreover, enforcement was generally limited to fines, which, when levied against high-profile offenders, were widely announced. The affluent accepted fines as merely a tax on privilege, even as the amounts increased with frequent revisions to the laws. Historians have therefore argued that enforcing sumptuary laws only minimally may have been a way to avoid undermining the laws' aims, given that ______", "question": "Which choice most logically completes the text?", "choices": {"A": "less-affluent citizens were reluctant to risk incurring a fine and thus voluntarily complied with the laws even in the absence of regular enforcement.", "B": "the few fines that were imposed under the laws were tolerable to wealthy offenders and thus did not help the laws serve their intended purpose.", "C": "authorities focused enforcement on the wealthiest offenders, recognizing that pursuing offenders who were unable to pay the fines could weaken fines' effectiveness as a deterrent.", "D": "the public announcement of fines could signal offenders' wealth and status, placing enforcement of the laws in conflict with their intent."}, "answer": "D", "source_page": 53, "visual": null, "warning": ""}, {"module": "Module 2", "number": 16, "title": "Delta blues", "passage": "To experience both the multi-instrument groove of contemporary blues music and the stripped-down Delta blues of Andy Rodgers and other blues forebearers ______ the rich history of the genre.", "question": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "to realize", "B": "are realizing", "C": "is to realize", "D": "realizing"}, "answer": "C", "source_page": 54, "visual": null, "warning": ""}, {"module": "Module 2", "number": 17, "title": "Penny postage system", "passage": "In 1840, Rowland Hill's penny postage system revolutionized mail in Britain, rendering obsolete previous systems in which senders paid variable rates based on distance traveled and recipients often refused delivery to avoid owing postage. Following ______ lead came similar systems implemented by reformers in other nations, such as Wilhelm Naeff in Switzerland and José Clemente Pereira in Brazil.", "question": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "they're", "B": "their", "C": "its", "D": "it's"}, "answer": "C", "source_page": 55, "visual": null, "warning": ""}, {"module": "Module 2", "number": 18, "title": "Birder's ultimate goal", "passage": "An accomplished birder might be able to spot thousands of different species over the course of a career, from Camaroptera brachyura to Buteo brachyurus, but no birder has ever achieved the ultimate ______ an in-person glimpse of all 10,000-plus species of birds.", "question": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "goal. Catching", "B": "goal: catching", "C": "goal; catching", "D": "goal catching"}, "answer": "B", "source_page": 56, "visual": null, "warning": ""}, {"module": "Module 2", "number": 19, "title": "Huseby Klev site", "passage": "The Huseby Klev archaeological site in Sweden was exceptionally well-preserved beneath a layer of clay, which sealed artifacts into what scientists describe as a natural geological time capsule. As a result, ______ and his colleagues were able to extract and analyze DNA from chewed tree resin dating back nearly 10,000 years.", "question": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "paleogeneticist Emrah K■ rdök", "B": "paleogeneticist, Emrah K■ rdök", "C": "paleogeneticist, Emrah K■ rdök,", "D": "paleogeneticist Emrah K■ rdök,"}, "answer": "A", "source_page": 57, "visual": null, "warning": "Source warning: a proper name contains a corrupted character."}, {"module": "Module 2", "number": 20, "title": "Museum of Appalachia", "passage": "When historian John Irwin founded the Museum of Appalachia in Clinton, Tennessee, in the 1960s, it consisted of just a single log structure. Today, it is a 65-acre living history museum featuring vast collections of folk art, including carvings, textiles, and ______ Arnwine Cabin, one of thirty-five historic log buildings on the property; and a re-created pioneer-era Appalachian farm.", "question": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "paintings;", "B": "paintings", "C": "paintings.", "D": "paintings,"}, "answer": "A", "source_page": 58, "visual": null, "warning": ""}, {"module": "Module 2", "number": 21, "title": "Mary Elizabeth Banning", "passage": "Mary Elizabeth Banning was a self-taught mycologist, or fungi specialist, who researched mushrooms in the late 1800s. Banning documented her findings in The Fungi of Maryland, an unpublished manuscript consisting of 175 watercolor ______ a detailed portrait of a particular species, such as Polyporus beattei, a fungi species of the order Hymenomycetes presented on plate 118.", "question": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "plates, each was", "B": "plates; each being", "C": "plates, each", "D": "plates; each"}, "answer": "C", "source_page": 59, "visual": null, "warning": ""}, {"module": "Module 2", "number": 22, "title": "The species problem", "passage": "In biology there is no single agreed-upon concept of what defines a species; ______ numerous competing species concepts are used within the field, a dilemma known as the species problem. The genotypic cluster species concept, described in 1995 by Mallet, defines species in accordance with genetic similarity, while the general lineage species concept, delineated by Queiroz in 1998, organizes species according to evolutionary lineage.", "question": "Which choice completes the text with the most logical transition?", "choices": {"A": "as a result,", "B": "for instance,", "C": "in addition,", "D": "however,"}, "answer": "A", "source_page": 60, "visual": null, "warning": ""}, {"module": "Module 2", "number": 23, "title": "Ground-penetrating radar", "passage": "Massimo Coli and colleagues used ground-penetrating radar (GPR) to map moisture infiltration within the walls of Saint John Baptistery in Florence, Italy. The contrast between wet and dry materials produces vivid radar echoes that delineate leak pathways, yet the presence of water-saturated zones also hampers the efficacy of the technique. ______ even as GPR makes such areas conspicuous, water within masonry absorbs and scatters radar energy, often obscuring defects in layers beyond the saturated region.", "question": "Which choice completes the text with the most logical transition?", "choices": {"A": "Likewise,", "B": "Nevertheless,", "C": "Thus,", "D": "Indeed,"}, "answer": "D", "source_page": 61, "visual": null, "warning": ""}, {"module": "Module 2", "number": 24, "title": "NYT Best Sellers", "passage": "Since 1931, the New York Times (NYT) Best Sellers list has been a measure of the most successful books in the US.  Ta-Nehisi Coates and Tayari Jones are Black authors who have reached the NYT Best Sellers list.  Between the World and Me is a nonfiction book by Ta-Nehisi Coates.  It reached the NYT Best Sellers list on August 2, 2015.  An American Marriage is a novel by Tayari Jones.  It reached the NYT Best Sellers list on February 6, 2018.", "question": "Which choice most effectively uses information from the given sentences to emphasize the different years in which the books reached the NYT Best Sellers list?", "choices": {"A": "Ta-Nehisi Coates and Tayari Jones are both NYT best-selling authors.", "B": "Ta-Nehisi Coates's Between the World and Me and Tayari Jones's An American Marriage are both NYT best sellers, but the former is a nonfiction book, whereas the latter is a novel.", "C": "The nonfiction book Between the World and Me became an NYT best seller in 2015; An American Marriage, a novel, joined this list as well, but in 2018.", "D": "Between the World and Me and An American Marriage are both books by Black authors that have reached the NYT Best Sellers list."}, "answer": "C", "source_page": 62, "visual": null, "warning": ""}, {"module": "Module 2", "number": 25, "title": "Shinkansen / kingfisher", "passage": "While researching a topic, a student has taken the following notes:<ul class=\"notes\"><li>The Shinkansen, commonly known as the bullet train, is a network of high-speed railways in Japan.</li><li>1960s: The trains' high speeds created intense pressure waves that produced sonic booms when the trains exited tunnels.</li><li>1980s: Engineer Eiji Nakatsu noted that the kingfisher bird could dive into water at high speeds while barely creating a splash.</li><li>The kingfisher's beak gradually widens from tip to head, allowing the bird to transition smoothly between air and water.</li><li>Nakatsu and the other engineers redesigned the train nose based on the kingfisher's beak structure to improve the train's transition between tunnel and open-air environments.</li><li>The redesign reduced pressure buildup, eliminating sonic booms.</li></ul>", "question": "The student wants to explain how the kingfisher's beak structure was used to solve the bullet train's sonic boom problem. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Nakatsu discovered that the kingfisher's beak structure eliminated sonic booms, and the redesign improved the train's transition between tunnel and open-air environments.", "B": "Nakatsu's observation of kingfishers diving into water showed how the bird's beak structure could help the train eliminate sonic booms.", "C": "By redesigning the train's nose to imitate the kingfisher's gradually widening beak shape, engineers improved the train's transition between tunnels and open air, eliminating sonic booms.", "D": "The shape of the kingfisher's beak inspired engineers to reshape the train nose into one that gradually widens, allowing the train to move smoothly between air and water."}, "answer": "C", "source_page": 63, "visual": null, "warning": ""}, {"module": "Module 2", "number": 26, "title": "Public domain / Frost & Lewis", "passage": "While researching a topic, a student has taken the following notes:<ul class=\"notes\"><li>A copyright prevents a book's contents from being reproduced (published) without permission from the copyright holder.</li><li>When a book's copyright expires, the book enters the public domain and can be legally reproduced by anyone.</li><li>New Hampshire is a poetry collection by Robert Frost.</li><li>It entered the public domain in 2019.</li><li>Arrowsmith is a novel by Sinclair Lewis.</li><li>It entered the public domain in 2021.</li></ul>", "question": "The student wants to emphasize a similarity between Robert Frost and Sinclair Lewis. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Both New Hampshire and Arrowsmith are in the public domain; however, one is a poetry collection and the other a novel.", "B": "The year was 2021, and the copyright to Sinclair Lewis's Arrowsmith had finally expired.", "C": "New Hampshire, a poetry collection by Robert Frost, entered the public domain in 2019, unlike Sinclair Lewis's novel Arrowsmith.", "D": "Robert Frost and Sinclair Lewis are two authors whose works recently entered the public domain."}, "answer": "D", "source_page": 64, "visual": null, "warning": ""}, {"module": "Module 2", "number": 27, "title": "Clovis First (Schaefer / Lovewell)", "passage": "While researching a topic, a student has taken the following notes:<ul class=\"notes\"><li>The Clovis First hypothesis proposes that ancient humans known as Clovis were the first to populate North America.</li><li>The Clovis arrived around 13,000 years ago.</li><li>Stone tools found at the Schaefer site in Wisconsin date to approximately 16,500 years ago.</li><li>Butchered mammoth bones found at the Lovewell site in Kansas date to approximately 22,000 years ago.</li><li>These items support the idea that humans were present in North America before the Clovis population arrived.</li></ul>", "question": "The student wants to emphasize a similarity between the items found at Schaefer and those found at Lovewell. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Stone tools from Schaefer date to approximately 16,500 years ago; in addition, butchered mammoth bones (which date to approximately 22,000 years ago) were discovered at Lovewell.", "B": "The Clovis First hypothesis proposes that the Clovis, arriving around 13,000 years ago, were the first humans in North America.", "C": "Although the butchered mammoth bones found at Lovewell are older than the stone tools found at Schaefer, both clearly predate the arrival of the Clovis population.", "D": "Objects discovered at Schaefer date to approximately 16,500 years ago; those found at Lovewell precede them, however, dating to approximately 22,000 years ago."}, "answer": "C", "source_page": 65, "visual": null, "warning": ""}, {"module": "Hard Module 1", "number": 4, "title": "Khipu", "passage": "The presumptive functionality of khipu, the semiotic system of knotted cords once used by Indigenous Andean peoples, to encode language (perhaps, like ancient Chinese script, in units of discrete words) now has an empirical basis: Manuel Medrano's statistical data on Spanish translations of khipu content, as recited by Aymara-speaking scribes, ______ historical reports of khipu's status as a linguistic record.", "question": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "supplement", "B": "supersede", "C": "replicate", "D": "complicate"}, "answer": "A", "source_page": 9, "visual": null, "warning": ""}, {"module": "Hard Module 1", "number": 6, "title": "Female birdsong (Texts 1 & 2)", "passage": "<div class=\"textblock\"><strong>Text 1</strong><p>For decades, ornithologists assumed that if they saw a singing Cassin's finch—a bird species found in temperate North America—they must be observing a male trying to attract a mate or claim territory. As Peter J.B. Slater and Nigel I. Mann have emphasized, however, a similar assumption can't be made about birds in the tropics, where females sing as often as males do. Slater and Mann call for more research on this discrepancy between tropical and temperate female birdsong.</p></div><div class=\"textblock\"><strong>Text 2</strong><p>Recent evidence shows that a female Cassin's finch is as capable of song as a male is. In fact, female birdsong is more common among temperate species than currently assumed, claim Evangeline Rose and colleagues. These female songbirds sing less frequently than males do, and in duller tones, making it \"easy for researchers to miss the quiet and hidden females and focus on the loud and colorful males,\" says Rose.</p></div>", "question": "Based on the texts, how would Rose and colleagues (Text 2) most likely respond to the assertion by Slater and Mann (Text 1) about the different prevalence of female birdsong in temperate and tropical areas?", "choices": {"A": "They would argue that the apparent difference in prevalence may partly reflect a difference in the ease with which female birdsong and male birdsong can be detected.", "B": "They would concede that the geographic difference in prevalence is real but argue that the frequency with which male tropical birds sing has been overstated by previous researchers.", "C": "They would raise the possibility that the difference in prevalence may be due to differences in the timing of the mating season among temperate and tropical bird species.", "D": "They would caution that the seeming difference in prevalence may be an artifact of researchers' tendency to study birdsong among temperate species more frequently than among tropical species."}, "answer": "A", "source_page": 14, "visual": null, "warning": ""}, {"module": "Hard Module 1", "number": 7, "title": "Predator-prey (Texts 1 & 2)", "passage": "<div class=\"textblock\"><strong>Text 1</strong><p>In parts of Finland, the least weasel is a major predator of the field vole. Researcher Tero Klemola and colleagues found that when this predation pressure on field voles was temporarily reduced, their numbers significantly increased. This finding illustrates a foundational ecological principle: predators control prey population numbers.</p></div><div class=\"textblock\"><strong>Text 2</strong><p>Michel Crête and Hélène Jolicoeur found that excluding wolves from a site in Quebec, Canada, where they typically prey on moose had no significant effect on moose abundance. Many other predation relief studies show an increase in prey abundance, but those studies often focus on small, rapidly reproducing prey, like birds, voles, and rabbits, rather than large, slowly reproducing prey, like moose, which could account for the difference between those results and Crête and Jolicoeur's results.</p></div>", "question": "Based on the texts, the author of Text 2 would most likely agree with which statement about the \"principle\" mentioned in Text 1?", "choices": {"A": "It has been challenged by some studies, but the findings of those studies have not been widely accepted.", "B": "It may be true for some predators but only because those predators share certain physical characteristics.", "C": "It has some evidential support, but it should not be regarded as universally applicable.", "D": "It is plausible, but many of the studies that support it have methodological flaws."}, "answer": "C", "source_page": 16, "visual": null, "warning": ""}, {"module": "Hard Module 1", "number": 9, "title": "Uman", "passage": "New York–based artist Uman is no stranger to crossing borders: born in Somalia, she lived in Kenya and Denmark before moving to the United States. Her art, too, straddles multiple boundaries. Drawing on knowledge of everything from East African fabrics to Arabic calligraphy, Uman's kaleidoscopic paintings often combine abstract shapes with anthropomorphic elements, like eyes, mouths, and gestures. Moreover, she seeks to cultivate a practice of \"constant evolution\" untethered from any prescriptive agenda, so that her art navigates a liminal space between tradition and autobiography, community and itinerancy, and activism and contemplation.", "question": "Which statement about Uman's art is most strongly supported by the text?", "choices": {"A": "Its rejection of established aesthetic criteria can be traced to Uman's ambivalence toward cultural traditions.", "B": "Its adherence to certain dichotomies sets it apart from the work of most abstract artists based in the United States.", "C": "Its openness to experimentation is evident in its diverse influences and refusal to adhere to a single conceptual frame.", "D": "Its spontaneity makes it challenging for critics to recognize the conventions of genre that Uman chooses to observe."}, "answer": "C", "source_page": 18, "visual": null, "warning": ""}, {"module": "Hard Module 1", "number": 9, "title": "Tax Complexity Index (table)", "passage": "Every two years from 2016 to 2022, the research project Accounting for Transparency has conducted a worldwide survey of tax consultants and tax services firms in order to calculate the Tax Complexity Index, a measure of the complexity of a nation's corporate income tax system. The index ranges from zero (minimally complex) to one (extremely complex). In the table, the country with the simplest corporate tax system in 2022 was ______", "question": "Which choice most effectively uses data from the table to complete the statement?", "choices": {"A": "Switzerland.", "B": "India.", "C": "the United States.", "D": "Kenya."}, "answer": "A", "source_page": 19, "visual": {"type": "table", "title": "Corporate Tax Complexity Index for Four Countries, 2022", "headers": ["Country", "Tax Complexity Index"], "rows": [["India", "0.42"], ["Kenya", "0.37"], ["Switzerland", "0.23"], ["United States", "0.40"]]}, "warning": ""}, {"module": "Hard Module 1", "number": 10, "title": "Sleight-of-hand photo study", "passage": "In 2005, Swedish researchers studying flawed choice recall devised an experiment in which participants were shown two photos of different faces and asked to select the one they found more attractive. The researchers appeared to give the participants the photo they had chosen, but in fact used sleight of hand to give them the photo of the person they had not chosen. Most participants accepted the swap and, when asked to explain their initial preference, gave justifications for having chosen the face in the photo they were given. Subsequent researchers have replicated this finding with other choices, including jam preferences.", "question": "Based on the text, why was the sleight-of-hand step an important part of the experiment?", "choices": {"A": "It allowed the researchers to control for the possibility that some participants found the two faces roughly equally attractive.", "B": "It helped the researchers test whether participants would embrace an outcome they thought was consistent with their intention even when it was truly contradictory.", "C": "It enabled the researchers to determine whether the thought process involved in selecting which photo had the more attractive face was similar to the thought process involved in selecting a preferred jam.", "D": "It allowed the researchers to measure the willingness of participants to change their positions when presented with persuasive counterarguments."}, "answer": "B", "source_page": 20, "visual": null, "warning": ""}, {"module": "Hard Module 1", "number": 11, "title": "Declaration of Independence, 1776", "passage": "Narratives of American revolutionary history often imply that the US Declaration of Independence (published in 1776) was a document that specifically resulted from the presumably exceptional nature of the soon-to-be United States—in this interpretation, the Declaration is a singular instrument born from a response to injustice that was intended to announce the birth of a new kind of nation and win foreign allies to that nation's cause. But this interpretation neglects to place the Declaration in the larger context of eighteenth-century Western political philosophy—<u>the Declaration was only one of several significant works published during 1776, a remarkable year for political thought</u>.", "question": "Which statement, if true, would most strongly support the claim in the underlined portion?", "choices": {"A": "In 1776, the English historian Edward Gibbon began publishing The History of the Decline and Fall of the Roman Empire, a work whose novel theories of empire collapse proved politically influential.", "B": "In late 1776, Benjamin Franklin traveled to France to seek French support for the American cause, eventually leading to France providing both military and financial aid to the Americans.", "C": "Newspapers in 1776 were often read aloud in public places, ensuring that even those who did not read newspapers themselves could still knowledgeably participate in political discussions.", "D": "George Campbell's The Philosophy of Rhetoric, a highly influential attempt to develop a foundational theory of how humans communicate, was published in 1776."}, "answer": "A", "source_page": 23, "visual": null, "warning": ""}, {"module": "Hard Module 1", "number": 12, "title": "French Revolution writers", "passage": "A student is writing an essay about how writers of the late 1700s responded to the French Revolution and wants to include two pieces of textual evidence that show closely aligned attitudes toward the revolution. The student has selected the following quotation, adapted from Helen Maria Williams's 1791 poem \"A Farewell, for Two Years, to England\": In new-born majesty [France] seems to rise, While sudden from the land oppression flies. So, at the solemn hour of Nature's birth, When brooding darkness veil'd the beauteous earth, Heaven's awful mandate pierc'd the solid night, \"Let there be light,\" it said, \"and there was light!\"", "question": "Which quotation from another prominent writer of the same period would be most effective for the student to include along with the quotation from Williams's poem?", "choices": {"A": "\"[Liberty] scorns to distain / Her righteous cause with carnage, and resigns / To Fraud and Anarchy the infuriate crowd.\" (Charlotte Smith)", "B": "\"Reason has, at last, shown her captivating face, beaming with benevolence; and it will be impossible for the dark hand of despotism again to obscure its radiance.\" (Mary Wollstonecraft)", "C": "\"The age of chivalry is gone. That of sophisters, economists, and calculators has succeeded; and the glory of Europe is extinguished forever.\" (Edmund Burke)", "D": "\"Let human nature, conscious of its own infirmities, humbly solicit the protection of Omnipotence against the arrogance of human Reason, whenever, proud of her own supremacy, she presumes to pass the interdicted bounds prescribed to her finite powers.\" (Jane West)"}, "answer": "B", "source_page": 25, "visual": null, "warning": ""}, {"module": "Hard Module 1", "number": 13, "title": "Migrating animals (table)", "passage": "Some studies of migrating animals measure how far the animals travel in a year by fitting individuals with GPS tracking collars. Other studies track annual round-trip distance (RTD), which is equal to double the distance separating the two habitats a population migrates between each year. A researcher argues that since GPS records all of an animal's movements, using the GPS method to track a population would result in significantly higher recorded travel distances than using the RTD method would. For example, it's very likely that the distance reported for the ______", "question": "Which choice most effectively uses data from the table to complete the example?", "choices": {"A": "caribou would be greater than 2,155 kilometers if the RTD method had been used.", "B": "caribou would be less than 3,807 kilometers if the RTD method had been used.", "C": "white-eared kob would be less than 400 kilometers if the GPS method had been used.", "D": "white-eared kob would be greater than 3,807 kilometers if the GPS method had been used."}, "answer": "B", "source_page": 27, "visual": {"type": "table", "title": "Reported Annual Travel Distances in Four Studies of Migrating Animal Populations", "headers": ["Animal population", "Annual travel distance", "Method"], "rows": [["Mule deer, North America", "772 km", "RTD"], ["Caribou, North America", "3,807 km", "GPS"], ["Gray wolf, North America", "2,155 km", "GPS"], ["White-eared kob, Africa", "400 km", "RTD"]]}, "warning": ""}, {"module": "Hard Module 1", "number": 14, "title": "Jupiter's upper atmosphere", "passage": "O'Donoghue et al. (2021) analyzed temperature data of Jupiter's upper atmosphere observed in 2016 and 2017. When superimposed on a map of Jupiter, time-lapse data representing several hours of observations from one day in 2016 and one day in 2017 indicate an overall temperature gradient from the poles to the equator, with highest temperatures occurring at the poles, which undergo auroral heating. But the 2017 data exhibit a large oval of unusually elevated temperature separated from the aurora at one pole by a band of cooler atmosphere. No other known heating mechanism on Jupiter could account for the formation of this anomalous structure, so one hypothesis considered was that it was ejected from the auroral region toward the equator.", "question": "Which finding about Jupiter's upper atmosphere, if true, would most strongly support the hypothesis as described in the text?", "choices": {"A": "The 2017 data viewed in time-lapse show greater disparities between polar and equatorial temperatures at the beginning of the observation period than at the end of the period observed.", "B": "Comparing the data observed in 2016 with those observed in 2017 suggests that the anomalous oval of elevated temperature began forming in 2016.", "C": "The 2017 data viewed in time-lapse appear to show the oval of elevated temperature drifting slightly away from the area of auroral heating over a period of several hours.", "D": "According to the data, auroral temperatures in 2016 were higher than those in 2017, although in both years the highest observed temperatures were harbored in auroral zones."}, "answer": "C", "source_page": 28, "visual": null, "warning": ""}, {"module": "Hard Module 1", "number": 15, "title": "Chacon / Earles painters", "passage": "Although she is indebted to the European tradition of figurative painting, with its proportionality of human form and depth between foreground and background, Navajo (Diné) painter Nanibah Chacon uses her formidable technique to portray—and thereby ensure the transmission of—cultural traditions predating the European colonization of the lands of her tribe. Caddo painter Chad \"Nish\" Earles, on the other hand, largely eschews the European figurative mode; instead, he assembles compositions out of abstract motifs common in the traditional ceramics and graphic art of his own tribe, thereby ______", "question": "Which choice most logically completes the text?", "choices": {"A": "suggesting that figurative forms of art may be ill-suited to portraying tribally specific content.", "B": "perpetuating tribal culture through a mode of abstraction that is tribally specific.", "C": "casting doubt on the feasibility of developing a new style of painting grounded in traditionally figurative art forms.", "D": "implying his belief that both figurative and abstract art can reflect the complexity of tribal identity."}, "answer": "B", "source_page": 29, "visual": null, "warning": ""}],KEY="sat_rw_aug_focus_v3";let S=JSON.parse(localStorage.getItem(KEY)||'null')||{answers:{},flags:{},current:0,filter:'all'};let V=[];
const qid=q=>q.module+"|"+q.source_page+"|"+q.title;
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function vis(){V=Q.map((q,i)=>i).filter(i=>S.filter==='all'||(S.filter==='m2'&&Q[i].module==='Module 2')||(S.filter==='m1'&&Q[i].module==='Hard Module 1')||(S.filter==='flag'&&S.flags[qid(Q[i])]))}
function setFilter(f){S.filter=f;S.current=0;save();render()}
function draw(v){if(!v)return '';if(v.type==='table')return `<div class="visual"><h4>${v.title}</h4><table><tr>${v.headers.map(x=>`<th>${x}</th>`).join('')}</tr>${v.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
let mx=Math.max(...v.a,...v.b);return `<div class="visual"><h4>${v.title}</h4><div class="chartwrap">${v.labels.map((l,i)=>`<div style="flex:1;height:100%;display:flex;flex-direction:column"><div class="g" style="flex:1;height:auto"><div class="bar" title="${v.a[i]}" style="height:${100*v.a[i]/mx}%"></div><div class="bar b" title="${v.b[i]}" style="height:${100*v.b[i]/mx}%"></div></div><div class="xl">${l}</div></div>`).join('')}</div><div class="legend">Dark: ${v.legend[0]} · Light: ${v.legend[1]}</div></div>`}
function render(){vis();if(!V.length){qc.innerHTML="<h2>No questions in this view.</h2>";nav.innerHTML="";return}S.current=Math.min(S.current,V.length-1);let q=Q[V[S.current]],k=qid(q),a=S.answers[k]||{tries:0};
let choices=Object.entries(q.choices).map(([L,t])=>{let c='choice';if(a.done&&L===q.answer)c+=' correct';if(!a.done&&a.lastWrong===L)c+=' wrong';return `<button class="${c}" onclick="pick('${L}')"><b>${L})</b> ${t}</button>`}).join('');
let fb=a.done?`<div class="feedback"><b>Correct.</b> ${a.tries===1?'First try.':'Second try.'}</div>`:a.revealed?`<div class="feedback"><b>Answer: ${q.answer}.</b> Flagged automatically for review.</div>`:a.tries===1?`<div class="feedback"><b>Not quite.</b> One more attempt before the answer is shown.</div>`:'';
qc.innerHTML=`<div class="meta">${q.module} · Q${q.number} · ${q.title} · source p.${q.source_page}</div>${q.warning?`<div class="warn">${q.warning}</div>`:''}${draw(q.visual)}<div class="passage">${q.passage}</div><div class="question">${q.question}</div>${choices}${fb}<div class="row" style="margin-top:16px"><button class="btn secondary" onclick="prev()">← Previous</button><button class="btn ${S.flags[k]?'flagged':'secondary'}" onclick="flag()">⚑ ${S.flags[k]?'Flagged':'Flag for later'}</button><button class="btn primary" style="margin-left:auto" onclick="next()">Next →</button></div>`;
let complete=Object.values(S.answers).filter(x=>x.done||x.revealed).length;progress.textContent=`${complete}/${Q.length} completed`;attempt.textContent=a.done?'Complete':a.tries===1?'Second chance':'First attempt';
nav.innerHTML=V.map((qi,i)=>{let qq=Q[qi],kk=qid(qq),aa=S.answers[kk]||{};return `<button class="qnav ${aa.done||aa.revealed?'done':''} ${S.flags[kk]?'flag':''} ${i===S.current?'current':''}" onclick="jump(${i})">${qq.number}</button>`}).join('');save()}
function pick(L){let q=Q[V[S.current]],k=qid(q),a=S.answers[k]||{tries:0};if(a.done||a.revealed)return;a.tries++;if(L===q.answer){a.done=true}else{a.lastWrong=L;if(a.tries>=2){a.revealed=true;S.flags[k]=true}}S.answers[k]=a;save();render()}
function flag(){let q=Q[V[S.current]],k=qid(q);S.flags[k]=!S.flags[k];save();render()}function next(){if(S.current<V.length-1)S.current++;save();render()}function prev(){if(S.current>0)S.current--;save();render()}function jump(i){S.current=i;save();render()}
function resetAll(){if(confirm("Erase all saved progress?")){localStorage.removeItem(KEY);S={answers:{},flags:{},current:0,filter:'all'};render()}}render();
</script></body></html>
