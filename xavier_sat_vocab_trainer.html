</style></head><body><div class="wrap"><header><div><h1>SAT Vocab</h1><div class="sub">8 weeks · 96 words · 5–10 minutes/day · adaptive spaced review</div></div><div class="pill" id="day"></div></header>

bar.style.width=`${Math.min(100,done/Math.max(1,done+Q.length)*100)}%`}
function show(){if(!cur)return;answer.innerHTML=`<p><b>${cur.word}</b> — ${cur.definition}</p><p><b>Synonym:</b> ${cur.synonym} &nbsp; · &nbsp; <b>Contrast:</b> ${cur.contrast}</p><p>“${cur.example}”</p><p class="muted">Rate recall, not familiarity.</p>`;answer.classList.add("show");reveal.style.display="none";ratings.style.display="grid";shown=true}
function rate(q){let c=S.cards[cur.word];c.reps++;S.reviews++;done++;if(q==="again"){c.streak=0;c.iv=0;c.e=Math.max(1.7,c.e-.2);c.due=iso()}else if(q==="hard"){c.e=Math.max(1.7,c.e-.08);c.iv=c.iv<=1?1:Math.max(1,Math.round(c.iv*1.25));c.due=add(iso(),c.iv)}else if(q==="good"){c.streak++;c.iv=c.iv===0?1:c.iv===1?3:Math.max(3,Math.round(c.iv*c.e));c.due=add(iso(),c.iv)}else{c.streak++;c.e=Math.min(2.8,c.e+.08);c.iv=c.iv===0?3:c.iv===1?5:Math.max(5,Math.round(c.iv*c.e*1.25));c.due=add(iso(),c.iv)}save();Q.shift();if(q==="again")Q.splice(Math.min(3,Q.length),0,cur);render()}
reveal.onclick=show;document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>rate(b.dataset.q));document.addEventListener("keydown",e=>{if(!cur)return;if(e.code==="Space"&&!shown){e.preventDefault();show()}if(shown&&"1234".includes(e.key))rate({"1":"again","2":"hard","3":"good","4":"easy"}[e.key])});
const open=h=>{box.innerHTML=h;modal.classList.add("show")};modal.onclick=e=>{if(e.target===modal)modal.classList.remove("show")};
help.onclick=()=>open(`<h2>How to use</h2><p>Do one session per day. Before revealing, force yourself to retrieve the answer.</p><p><b>Again</b> = wrong/blank. <b>Hard</b> = correct but hesitant. <b>Good</b> = correct in about 3 seconds. <b>Easy</b> = instant.</p><p>The trainer rotates word → definition, context meaning, and definition → word. Weak words return sooner; strong words space out.</p><p>Keyboard: <kbd>Space</kbd> reveal, <kbd>1</kbd> Again, <kbd>2</kbd> Hard, <kbd>3</kbd> Good, <kbd>4</kbd> Easy.</p><button class="secondary" onclick="modal.classList.remove('show')">Close</button>`);
list.onclick=()=>open(`<h2>96-word sequence</h2><p class="muted">${unlocked(day())} unlocked so far.</p>`+W.map(w=>{let c=S.cards[w.word],s=!c?"Locked":c.streak>=3&&c.iv>=7?"Strong":c.reps?"Learning":"New";return `<div class="row"><span>${w.index}. <b>${w.word}</b></span><span class="muted">${s}</span></div>`}).join("")+`<br><button class="secondary" onclick="modal.classList.remove('show')">Close</button>`);
reset.onclick=()=>open(`<h2>Reset all progress?</h2><p>This clears the study history stored in this browser.</p><button class="primary" onclick="localStorage.removeItem('${K}');location.reload()">Yes, reset</button><button class="secondary" style="margin-top:8px" onclick="modal.classList.remove('show')">Cancel</button>`);
intro();build();render();
</script></body></html>
